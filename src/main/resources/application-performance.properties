# Server
server.port=8081

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3308/veyro_performance
spring.datasource.username=performance
spring.datasource.password=performance_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.out-of-order=false

# Firebase
firebase.enabled=false

# Logging
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
spring.jpa.properties.hibernate.format_sql=false

logging.level.com.zaxxer.hikari=WARN



spring.datasource.hikari.maximum-pool-size=50

# Monitoring
management.endpoints.web.exposure.include=health,metrics,prometheus

# HTTP ?? ?? Histogram
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ?? ?? ?? ??
logging.file.name=logs/veyro-performance.log

# ?? ?? ?? ? ?? ??
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.logback.rollingpolicy.file-name-pattern=logs/archive/veyro-performance.%d{yyyy-MM-dd}.%i.log.gz

logging.pattern.file=${logging.pattern.console}

management.metrics.tags.environment=performance

