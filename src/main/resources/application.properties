spring.application.name=transfer-tracker

football.api.base-url=https://v3.football.api-sports.io
football.api.key=${API_FOOTBALL_KEY}

x.api.base-url=https://api.x.com
x.api.bearer-token=${X_API_BEARER_TOKEN}

spring.jpa.properties.hibernate.format_sql=true

openai.api.base-url=https://api.openai.com
openai.api.key=${OPENAI_API_KEY}
openai.api.model=gpt-5.6-luna

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-seconds=3600

# KAKAO Login
app.oauth.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.oauth.kakao.client-id=${KAKAO_CLIENT_ID:}
app.oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
app.oauth.kakao.redirect-uri=${KAKAO_REDIRECT_URI:}


## flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=true


spring.batch.job.enabled=false

# Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.com.zaxxer.hikari=INFO

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [requestId=%X{requestId:-none}] [memberId=%X{memberId:-anonymous}] %logger{36} - %msg%n

# Monitoring Common Tags
management.metrics.tags.application=veyro

spring.autoconfigure.exclude=org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration