spring.application.name=transfer-tracker

football.api.base-url=https://v3.football.api-sports.io
football.api.key=${API_FOOTBALL_KEY}

x.api.base-url=https://api.x.com
x.api.bearer-token=${X_API_BEARER_TOKEN}

spring.jpa.properties.hibernate.format_sql=true

openai.api.base-url=https://api.openai.com
openai.api.key=${OPENAI_API_KEY}
openai.api.model=gpt-5.6-luna

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-seconds=3600

# Kakao login credentials are supplied only through local/Railway environment variables.
app.oauth.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.oauth.kakao.client-id=${KAKAO_CLIENT_ID:}
app.oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
app.oauth.kakao.redirect-uri=${KAKAO_REDIRECT_URI:}


## flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
# 운영 DB에는 V9가 먼저 적용된 상태에서 V8이 추가되었다. 누락된 스키마 변경만
# 안전하게 적용하도록 허용한다. 이후에는 버전 순서대로 신규 마이그레이션을 추가한다.
spring.flyway.out-of-order=true


spring.batch.job.enabled=false
