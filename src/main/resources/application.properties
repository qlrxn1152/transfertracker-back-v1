spring.application.name=transfer-tracker

football.api.base-url=https://v3.football.api-sports.io
football.api.key=${API_FOOTBALL_KEY}

x.api.base-url=https://api.x.com
x.api.bearer-token=${X_API_BEARER_TOKEN}

spring.jpa.properties.hibernate.format_sql=true

admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}

openai.api.base-url=https://api.openai.com
openai.api.key=${OPENAI_API_KEY}
openai.api.model=gpt-5.6-luna

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-seconds=3600