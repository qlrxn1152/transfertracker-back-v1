spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

server.port=${PORT:8080}

# Vercel's beta URL works before a custom domain is configured. Set this to the
# exact frontend URL after the first frontend deployment.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.vercel.app}

firebase.enabled=true

management.metrics.tags.environment=prod
management.endpoints.web.exposure.include=health,metrics,prometheus

# ?? ?? ?? ??
logging.file.name=logs/veyro-prod.log

# ?? ?? ?? ? ?? ??
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.logback.rollingpolicy.file-name-pattern=logs/archive/veyro-prod.%d{yyyy-MM-dd}.%i.log.gz

logging.pattern.file=${logging.pattern.console}
