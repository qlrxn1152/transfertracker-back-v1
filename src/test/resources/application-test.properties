# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# Test environment
spring.test.database.replace=none

# External API test values
football.api.base-url=http://localhost
football.api.key=test-key

x.api.base-url=http://localhost
x.api.bearer-token=test-token

openai.api.base-url=http://localhost
openai.api.key=test-key
openai.api.model=test-model

# Spring Batch
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

