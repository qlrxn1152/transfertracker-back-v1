services:
  mysql-performance:
    image: mysql:8.4
    container_name: veyro-mysql-performance

    ports:
      - "127.0.0.1:3308:3306"

    environment:
      MYSQL_ROOT_PASSWORD: performance_root
      MYSQL_DATABASE: veyro_performance
      MYSQL_USER: performance
      MYSQL_PASSWORD: performance_password
      TZ: Asia/Seoul

    volumes:
      - performance_mysql_data:/var/lib/mysql

volumes:
  performance_mysql_data: